<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate GHL Enterprise Exam Sandbox Simulator</title>
    <style>
        :root {
            --bg-main: #0b111e;
            --bg-sidebar: #111827;
            --bg-card: #1f2937;
            --border: #374151;
            --text: #ffffff;
            --text-muted: #9ca3af;
            --ghl-blue: #2563eb;
            --ghl-blue-hover: #1d4ed8;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f97316;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text); display: flex; height: 100vh; overflow: hidden; margin: 0; }
        
        .ghl-sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; gap: 6px; height: 100vh; }
        .sidebar-brand { font-size: 15px; font-weight: 800; padding: 8px; color: var(--ghl-blue); border-bottom: 1px solid var(--border); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); text-align: left; padding: 12px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; width: 100%; transition: all 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: var(--bg-card); color: var(--text); }
        .nav-btn.active { border-left: 4px solid var(--ghl-blue); border-radius: 0 6px 6px 0; padding-left: 10px; }
        
        .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .top-proctor-bar { background: var(--bg-sidebar); border-bottom: 1px solid var(--border); padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .timer-badge { font-family: monospace; font-size: 32px; font-weight: bold; color: var(--success); background: rgba(16,185,129,0.05); padding: 4px 16px; border-radius: 6px; border: 1px solid var(--success); }
        .master-btn { background: var(--ghl-blue); color: #fff; border: none; padding: 12px 28px; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 14px; box-shadow: 0 4px 14px rgba(37,99,235,0.3); transition: background 0.2s; }
        .master-btn:hover { background: var(--ghl-blue-hover); }
        
        .content-body { flex: 1; padding: 28px; overflow-y: auto; display: flex; gap: 24px; }
        .ticket-card { width: 360px; background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: 8px; padding: 20px; height: fit-content; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .ticket-card h2 { font-size: 13px; text-transform: uppercase; color: var(--warning); letter-spacing: 0.5px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .data-row { font-size: 13px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .lbl { color: var(--text-muted); font-weight: 600; }
        .val { font-family: monospace; background: var(--bg-main); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); color: #fff; }
        
        .app-view-panel { flex: 1; background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: 8px; padding: 28px; display: none; min-height: 550px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .app-view-panel.active { display: block; }
        .view-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; color: #fff; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input, .input-group select, .input-group textarea { background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; padding: 12px; color: white; font-size: 14px; width: 100%; transition: border-color 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: var(--ghl-blue); outline: none; }
        
        .canvas-btn { background: var(--ghl-blue); color: white; border: none; padding: 12px 24px; font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .canvas-btn:hover { background: var(--ghl-blue-hover); }
        
        .node-canvas { background: #0c101b; border: 1px dashed var(--border); border-radius: 8px; min-height: 400px; display: flex; flex-direction: column; align-items: center; padding: 24px; background-image: radial-gradient(var(--border) 1px, transparent 0); background-size: 20px 20px; }
        .empty-canvas-msg { color: var(--text-muted); font-style: italic; font-size: 14px; text-align: center; margin: auto; line-height: 1.6; }
        .tag-pill-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; background: var(--bg-main); padding: 16px; border: 1px solid var(--border); border-radius: 6px; min-height: 60px; width: 100%; }
        .tag-pill { background: rgba(37,99,235,0.15); border: 1px solid var(--ghl-blue); color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-family: monospace; font-weight: 600; }
        
        .preview-box { background: var(--bg-main); border: 1px solid var(--border); border-radius: 20px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .chat-bubble-preview { width: 55px; height: 55px; background: var(--ghl-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; align-self: flex-end; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .status-banner { padding: 14px; border-radius: 6px; font-size: 14px; font-weight: 600; margin-top: 20px; display: none; }
        .status-banner.success-mode { background: rgba(16,185,129,0.1); border: 1px solid var(--success); color: var(--success); }
    </style>
</head>
<body>

    <div class="ghl-sidebar">
        <div class="sidebar-brand">GHL Exam Terminal</div>
        <button class="nav-btn active" id="nav-profile" onclick="switchView('profile')">🏢 Settings &amp; Profile</button>
        <button class="nav-btn" id="nav-pipelines" onclick="switchView('pipelines')">📊 Opportunity Pipelines</button>
        <button class="nav-btn" id="nav-tags" onclick="switchView('tags')">🏷️ Contact Tags Manager</button>
        <button class="nav-btn" id="nav-calendars" onclick="switchView('calendars')">📅 Calendar Settings</button>
        <button class="nav-btn" id="nav-chat" onclick="switchView('chat')">💬 Chat Widget Setup</button>
        <button class="nav-btn" id="nav-customvalues" onclick="switchView('customvalues')">🪙 Custom Value Tokens</button>
        <button class="nav-btn" id="nav-automations" onclick="switchView('automations')">⚡ Visual Workflows</button>
        <button class="nav-btn" id="nav-funnels" onclick="switchView('funnels')">🌐 Sites &amp; Domains</button>
    </div>

    <div class="main-wrapper">
        <div class="top-proctor-bar">
            <div>
                <h3 style="font-size: 16px;">Workspace Node Profile: <span id="currentWorkspaceNameGNT" style="color: var(--ghl-blue);">Unconfigured Shell</span></h3>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <div class="timer-badge" id="clockTimerGNT">45:00</div>
                <button class="master-btn" onclick="initializeFreshExamRun()">Initialize Exam Sandbox</button>
            </div>
        </div>

        <div class="content-body">
            
            <div class="app-view-panel active" id="view-profile">
                <div class="view-title">Business Profile Setup</div>
                <div class="form-grid">
                    <div class="input-group">
                        <label>Sub-Account Business Name *</label>
                        <input type="text" id="inputAccountNameGNT" placeholder="Ex: Bob Jones Dentistry CLM 08-25-26">
                    </div>
                    <div class="input-group">
                        <label>Company Corporate Phone *</label>
                        <input type="text" id="inputPhoneGNT" placeholder="8005551234">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="input-group">
                        <label>Corporate Operating Schedule *</label>
                        <select id="inputHoursGNT">
                            <option value="empty">-- Configure Operating Schedule Rows --</option>
                            <option value="correct">Mon - Fri (9:00 AM - 6:30 PM)</option>
                            <option value="wrong">Open 24/7 (Default Value Loop)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Sub-Account Base Timezone Lock *</label>
                        <select id="inputTZGNT">
                            <option value="empty">-- Select Target Region Timezone --</option>
                            <option value="EST">America/New_York (EST)</option>
                            <option value="CST">America/Chicago (CST)</option>
                            <option value="PST">America/Los_Angeles (PST)</option>
                        </select>
                    </div>
                </div>
