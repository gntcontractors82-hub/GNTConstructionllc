<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNT Construction Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; background: #111827; color: #f3f4f6; }
        .card { background: #1f2937; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-width: 400px; margin: 0 auto; }
        .btn { padding: 16px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 12px 0; width: 100%; box-sizing: border-box; }
        .in { background: #10b981; } .out { background: #ef4444; }
        #status { margin-top: 20px; font-size: 15px; font-weight: 500; padding: 12px; border-radius: 6px; }
        h3 { color: #f59e0b; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏗️ GNT Construction</h2>
        <div id="worker-greeting">Loading session...</div>
        <hr style="border-color: #374151; margin: 15px 0;">
        <p style="margin-bottom: 2px; color: #9ca3af;">Active Job Site:</p>
        <h3 id="site-display">Scanning...</h3>
        
        <button class="btn in" onclick="processPunch('Clocked In')">Clock In at Site</button>
        <button class="btn out" onclick="processPunch('Clocked Out')">Clock Out / Leave</button>
        
        <div id="status" style="background: #374151;">Awaiting Action</div>
    </div>

    <script>
        // Automatically harvest the dynamic GHL placeholders from the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const employeeEmail = urlParams.get('email') || "unknown@gntconstruction.com";
        const employeeName = urlParams.get('name') || "Team Member";
        const targetLat = parseFloat(urlParams.get('lat')) || 0;
        const targetLng = parseFloat(urlParams.get('lng')) || 0;
        const siteName = urlParams.get('site') || "Unassigned Site";
        const allowedRadiusMeters = 150; // Standard size boundary for construction sites

        // Render the dynamic content instantly to the screen
        document.getElementById('worker-greeting').innerText = `Welcome back, ${employeeName}`;
        document.getElementById('site-display').innerText = siteName;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const phi1 = lat1 * Math.PI/180;
            const phi2 = lat2 * Math.PI/180;
            const deltaPhi = (lat2-lat1) * Math.PI/180;
            const deltaLambda = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function processPunch(statusType) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.background = "#4b5563";
            statusDiv.innerText = "📡 Checking active site geofence...";
            
            if (!navigator.geolocation) {
                statusDiv.innerText = "❌ GPS not supported by browser.";
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                const distance = calculateDistance(userLat, userLng, targetLat, targetLng);

                if (distance <= allowedRadiusMeters) {
                    statusDiv.style.background = "#065f46";
                    statusDiv.innerText = `✅ Punch Verified: ${statusType}`;
                    sendToGHL(statusType, userLat, userLng);
                } else {
                    statusDiv.style.background = "#991b1b";
                    statusDiv.innerText = `❌ Blocked: You are ${(distance - allowedRadiusMeters).toFixed(0)}m away from the ${siteName} perimeter.`;
                }
            }, () => {
                statusDiv.innerText = "⚠️ Location tracking denied. Turn on high accuracy GPS.";
            }, { enableHighAccuracy: true });
        }

        function sendToGHL(status, lat, lng) {
            // Fires directly to your GNT Construction workflow endpoint
            fetch('https://leadconnectorhq.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: employeeEmail,
                    status: status,
                    site: siteName,
                    latitude: lat,
                    longitude: lng,
                    timestamp: new Date().toISOString()
                })
            });
        }
    </script>
</body>
</html>
